<!-- Chat Widget Bubble -->
<div id="chat-widget" class="chat-widget">
    <button id="chat-toggle" class="chat-toggle" aria-label="Apri chat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>

    <div id="chat-panel" class="chat-panel hidden">
        <div class="chat-header">
            <span>Chat con Nadia</span>
            <div class="chat-header-azioni">
                <!-- Scrivere "ricominciamo da capo" funziona lo stesso, ma lo
                     scopre solo chi legge il suggerimento del bot. -->
                <button id="chat-restart" class="chat-restart"
                        title="Ricomincia da capo"
                        aria-label="Ricomincia la conversazione da capo">&#8635;</button>
                <button id="chat-close" class="chat-close"
                        aria-label="Chiudi la chat">&times;</button>
            </div>
        </div>
        <!-- Vuoto di proposito: il saluto arriva dal bot appena si apre la
             chat, così resta nello storico della conversazione. Scriverlo qui
             faceva credere al cliente di aver già parlato con qualcuno che
             invece non ne sapeva nulla. -->
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Scrivi un messaggio..." autocomplete="off">
            <button id="chat-send" class="chat-send">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>
</div>
