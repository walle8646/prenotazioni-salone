services:
  - type: web
    name: salone-nadia-bot
    runtime: docker
    # ATTENZIONE: in produzione il piano e' a pagamento, e deve restarlo — sul
    # gratuito le porte SMTP sono bloccate e non parte nessuna email. Questo
    # valore vale solo se qualcuno risincronizza il blueprint da zero: se lo
    # fa, va rimesso il piano giusto dal dashboard.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salone-nadia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: salone-nadia-redis
          type: redis
          property: connectionString
      - key: ADMIN_USERNAME
        value: "nadia"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Casella del salone su Aruba. La 465 vuole SSL dal primo byte e la
      # 587 vuole STARTTLS: la strada la sceglie il codice guardando la
      # porta, quindi qui basta che il numero sia quello giusto.
      - key: SMTP_HOST
        value: "smtps.aruba.it"
      - key: SMTP_PORT
        value: "465"
      # L'utente e' l'indirizzo per intero, non la parte prima della chiocciola
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SLOT_DURATION_MIN
        value: "30"
      - key: MAX_BOOKING_DAYS_AHEAD
        value: "30"
      - key: CANCEL_POLICY_HOURS
        value: "2"
      # Numero del salone, dato al cliente quando è troppo tardi per disdire
      - key: SALONE_TELEFONO
        sync: false
      # Indirizzo pubblico del servizio. Serve a WhatsApp: le immagini Meta se
      # le viene a prendere da sé, quindi non basta un percorso. Senza, le
      # scelte su WhatsApp restano testo e funzionano lo stesso.
      - key: PUBLIC_BASE_URL
        value: "https://simoneacconciature.it"
      - key: INACTIVITY_DAYS
        value: "60"
      - key: SESSION_TTL_SECONDS
        value: "7200"
      - key: MAX_HISTORY_MESSAGES
        value: "20"
      # Da configurare manualmente nel dashboard Render:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: "claude-sonnet-4-6"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GCAL_SALONE_ID
        sync: false
      - key: GCAL_PARRUCCHIERE_IDS
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false

  - type: redis
    name: salone-nadia-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: salone-nadia-db
    plan: free
    databaseName: salone_nadia
    postgresMajorVersion: "16"
