# QUESTO FILE DESCRIVE L'INFRASTRUTTURA, NON LA COMANDA.
#
# I tre servizi esistono gia' e si configurano dal dashboard di Render, che e'
# l'unica fonte di verita': piani, variabili con `sync: false`, dominio
# personalizzato. Qui resta il disegno d'insieme, utile a chi arriva e deve
# capire come sta in piedi la cosa, e a ricostruirla da zero se un giorno
# servisse.
#
# Il motivo non e' filosofico. Un blueprint che si sincronizza da solo a ogni
# push ha provato a fare due danni in due ore: declassare il database al piano
# gratuito (fallendo, per fortuna: sul gratuito le porte SMTP sono bloccate e
# le email avrebbero smesso di partire) e sovrascrivere l'indirizzo pubblico
# mentre le DNS erano ancora a meta' del passaggio. Cose che il codice non sa,
# e che un file versionato non puo' sapere.
#
# Da qui due regole. Tutto cio' che cambia per motivi operativi va
# `sync: false`. E il piano non si dichiara: omesso, Render tiene quello che
# il servizio ha gia'; scritto a mano, invecchia e a un certo punto declassa.

services:
  - type: web
    name: salone-nadia-bot
    runtime: docker
    # Nessun `plan` dichiarato, in nessuno dei tre servizi, ed e' una scelta:
    # omettendolo Render tiene il piano che il servizio ha gia'. Scritto a mano
    # invece invecchia — questo file diceva ancora `free` mesi dopo il
    # passaggio al piano a pagamento, e il sync e' fallito proprio li':
    # "cannot downgrade database from 0.1c-256mb to Free". Il fallimento ci ha
    # protetti: sul gratuito le porte SMTP sono bloccate, e le email avrebbero
    # smesso di partire un'ora dopo averle fatte funzionare.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salone-nadia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: salone-nadia-redis
          type: redis
          property: connectionString
      - key: ADMIN_USERNAME
        value: "nadia"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Casella del salone su Aruba. La 465 vuole SSL dal primo byte e la
      # 587 vuole STARTTLS: la strada la sceglie il codice guardando la
      # porta, quindi qui basta che il numero sia quello giusto.
      - key: SMTP_HOST
        value: "smtps.aruba.it"
      - key: SMTP_PORT
        value: "465"
      # L'utente e' l'indirizzo per intero, non la parte prima della chiocciola
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SLOT_DURATION_MIN
        value: "30"
      - key: MAX_BOOKING_DAYS_AHEAD
        value: "30"
      - key: CANCEL_POLICY_HOURS
        value: "2"
      # Numero del salone, dato al cliente quando è troppo tardi per disdire
      - key: SALONE_TELEFONO
        sync: false
      # Indirizzo pubblico del servizio: Meta va a prendersi da se' l'immagine
      # con le facce degli operatori, quindi non basta un percorso e un
      # indirizzo irraggiungibile fa fallire il messaggio intero, non solo la
      # foto. Lo comanda il dashboard e non questo file, perche' cambia per
      # motivi che col codice non c'entrano: finche' i nodi DNS di Aruba non
      # sono allineati vale ancora `https://salone-nadia-bot.onrender.com`, e
      # diventa `https://simoneacconciature.it` quando lo sono.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: INACTIVITY_DAYS
        value: "60"
      - key: SESSION_TTL_SECONDS
        value: "7200"
      - key: MAX_HISTORY_MESSAGES
        value: "20"
      # Da configurare manualmente nel dashboard Render:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: "claude-sonnet-4-6"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GCAL_SALONE_ID
        sync: false
      - key: GCAL_PARRUCCHIERE_IDS
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false

  - type: redis
    name: salone-nadia-redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: salone-nadia-db
    databaseName: salone_nadia
    postgresMajorVersion: "16"
