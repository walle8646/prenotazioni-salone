services:
  app:
    build: .
    ports:
      - "8000:8000"
    # .env è facoltativo: serve solo per le credenziali vere (Claude, Google,
    # Meta, Resend). Senza, lo stack locale parte lo stesso con i valori qui
    # sotto, che puntano ai servizi del compose invece che a localhost.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://salone:salone_dev_password@postgres:5432/salone_nadia}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salone_nadia
      POSTGRES_USER: salone
      POSTGRES_PASSWORD: salone_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
